name: Apply pseudo recovery patch

on:
  push:
    paths:
      - 'tools/apply_pseudo_recovery_patch.py'
      - 'tools/apply_pseudo_recovery_patch_v2.py'
      - '.github/workflows/apply-pseudo-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/apply_pseudo_recovery_patch_v2.py

      - name: Verify expected changes
        run: |
          grep -q 'id="pinInput"' accueil.html
          grep -q 'function recoveryMarker' accueil.html
          grep -q 'function recoveryMarker' script3.js
          grep -q 'v3-5-7-pseudo-recovery' service-worker.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accueil.html script3.js service-worker.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Simplify pseudo system and add 4-digit recovery"
            git push
          fi
